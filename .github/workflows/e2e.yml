name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to test"
        required: false
        type: string

env:
  GO_VERSION: "1.25.9"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  playwright:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openoms
          POSTGRES_PASSWORD: openoms_dev
          POSTGRES_DB: openoms_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U openoms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Run all migrations
        run: |
          for f in $(ls apps/api-server/migrations/*.up.sql | sort); do
            echo "Running migration: $f"
            PGPASSWORD=openoms_dev psql -h localhost -U openoms -d openoms_dev -f "$f"
          done

      - name: Seed test data
        run: PGPASSWORD=openoms_dev psql -h localhost -U openoms -d openoms_dev -f scripts/seed.sql

      - name: Start API server
        run: |
          cd apps/api-server
          go build -o api-server ./cmd/server
          DATABASE_URL="postgres://openoms:openoms_dev@localhost:5432/openoms_dev?sslmode=disable" \
          REDIS_URL="redis://localhost:6379" \
          JWT_SECRET="ci-test-jwt-secret-not-for-production" \
          ENCRYPTION_KEY="a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2" \
          ./api-server &

      - name: Wait for API server
        run: timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - name: Install dashboard dependencies
        run: cd apps/dashboard && npm ci

      - name: Install Playwright
        run: cd apps/dashboard && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd apps/dashboard && npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7
