name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.9"
  NODE_VERSION: "22"

jobs:
  auto-format:
    name: Auto-format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0

      - name: Auto-fix Go code
        run: |
          for dir in apps/api-server packages/allegro-go-sdk packages/inpost-go-sdk packages/order-engine packages/erli-go-sdk packages/ebay-go-sdk; do
            echo "Fixing $dir..."
            golangci-lint run --fix --timeout=5m "./$dir/..." || true
          done

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Auto-fix frontend code
        working-directory: apps/dashboard
        run: |
          npm ci
          npx eslint --fix src/ || true

      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "style: auto-format code"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint api-server
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: apps/api-server
          args: --timeout=5m
          only-new-issues: true

      - name: Lint allegro-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: packages/allegro-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint inpost-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: packages/inpost-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint order-engine
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: packages/order-engine
          args: --timeout=5m
          only-new-issues: true

      - name: Lint erli-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: packages/erli-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint ebay-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          working-directory: packages/ebay-go-sdk
          args: --timeout=5m
          only-new-issues: true

  lint-strict:
    name: Lint (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint api-server
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: apps/api-server
      - name: Lint allegro-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: packages/allegro-go-sdk
      - name: Lint inpost-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: packages/inpost-go-sdk
      - name: Lint order-engine
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: packages/order-engine
      - name: Lint erli-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: packages/erli-go-sdk
      - name: Lint ebay-go-sdk
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.9.0
          args: --timeout=5m
          working-directory: packages/ebay-go-sdk

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan api-server
        working-directory: apps/api-server
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - name: Scan allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - name: Scan inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - name: Scan order-engine
        working-directory: packages/order-engine
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - name: Scan erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - name: Scan ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: |
          set +e
          govulncheck ./...
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 3 ]; then
            [ $rc -eq 3 ] && echo "::warning::govulncheck: vulnerabilities in deps but not called by code"
            exit 0
          fi
          exit 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Audit frontend dependencies
        working-directory: apps/dashboard
        run: npm ci && npm audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openoms
          POSTGRES_PASSWORD: openoms_dev
          POSTGRES_DB: openoms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openoms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://openoms:openoms_dev@localhost:5432/openoms_dev?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run all migrations
        run: |
          # Apply all migration files in order (not just 000001)
          for f in $(ls apps/api-server/migrations/*.up.sql | sort); do
            echo "Applying: $(basename $f)"
            PGPASSWORD=openoms_dev psql -h localhost -U openoms -d openoms_dev -f "$f"
          done

      - name: Check SECURITY DEFINER grants
        run: PGPASSWORD=openoms_dev psql -h localhost -U openoms -d openoms_dev -f scripts/check-security-definer-public-execute.sql

      - name: Test api-server
        working-directory: apps/api-server
        run: go test -race -cover ./...

      - name: Test erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: go test ./...

      - name: Test allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: go test ./...

      - name: Test inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: go test ./...

      - name: Test order-engine
        working-directory: packages/order-engine
        run: go test ./...

      - name: Test dhl-go-sdk
        working-directory: packages/dhl-go-sdk
        run: go test ./...

      - name: Test ksef-go-sdk
        working-directory: packages/ksef-go-sdk
        run: go test ./...

      - name: Test amazon-sp-sdk
        working-directory: packages/amazon-sp-sdk
        run: go test ./...

      - name: Test dpd-go-sdk
        working-directory: packages/dpd-go-sdk
        run: go test ./...

      - name: Test gls-go-sdk
        working-directory: packages/gls-go-sdk
        run: go test ./...

      - name: Test btp-go-sdk
        working-directory: packages/btp-go-sdk
        run: go test ./...

      - name: Test ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: go test ./...

  security-tests:
    name: Security Tests
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run security tests
        working-directory: apps/api-server
        env:
          REDIS_URL: redis://localhost:6379
        run: go test -race -run 'TestSecurity_' ./internal/middleware/ ./internal/handler/

  vet:
    name: Vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet api-server
        working-directory: apps/api-server
        run: go vet ./...

      - name: Vet allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: go vet ./...

      - name: Vet inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: go vet ./...

      - name: Vet order-engine
        working-directory: packages/order-engine
        run: go vet ./...

      - name: Vet erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: go vet ./...

      - name: Vet ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: go vet ./...

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'migration:destructive')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check migration backward-compatibility
        run: |
          DANGEROUS_OPS="DROP COLUMN|DROP TABLE|DROP SCHEMA|DROP FUNCTION|DROP INDEX|RENAME COLUMN|ALTER[[:space:]].*TYPE|ALTER[[:space:]].*SET[[:space:]]+NOT[[:space:]]+NULL|TRUNCATE"
          NEW_MIGRATIONS=$(git diff --name-only origin/main... -- apps/api-server/migrations/ 2>/dev/null || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations found — skipping"
            exit 0
          fi
          BLOCKED=0
          for f in $NEW_MIGRATIONS; do
            if [ ! -f "$f" ]; then continue; fi
            DANGEROUS_MATCHES=$(grep -inEi "$DANGEROUS_OPS" "$f" || true)
            ADD_NOT_NULL_MATCHES=$(grep -inEi 'ADD[[:space:]].*NOT[[:space:]]+NULL' "$f" | grep -viE 'DEFAULT' || true)
            if [ -n "$DANGEROUS_MATCHES" ] || [ -n "$ADD_NOT_NULL_MATCHES" ]; then
              echo "BLOCKED: $f contains destructive operation"
              printf "%s\n%s\n" "$DANGEROUS_MATCHES" "$ADD_NOT_NULL_MATCHES" | sed '/^$/d'
              BLOCKED=1
            fi
          done
          if [ "$BLOCKED" = "1" ]; then
            echo ""
            echo "Blue-green deployment requires backward-compatible migrations."
            echo "Split destructive changes into 2 deploys."
            echo "Override: add 'migration:destructive' label to the PR."
            exit 1
          fi
          echo "All migrations are backward-compatible"

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            chart:
              - 'deploy/helm/openoms/**'

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        if: steps.filter.outputs.chart == 'true'

      - name: Lint chart
        if: steps.filter.outputs.chart == 'true'
        run: helm lint deploy/helm/openoms

      - name: Render chart
        if: steps.filter.outputs.chart == 'true'
        run: helm template openoms deploy/helm/openoms > /dev/null

      - name: No chart changes
        if: steps.filter.outputs.chart != 'true'
        run: echo "No Helm chart changes, skipping validation"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Lint
        working-directory: apps/dashboard
        run: npx eslint src/

      - name: Unit tests
        working-directory: apps/dashboard
        run: npx vitest run

      - name: Build
        working-directory: apps/dashboard
        run: npx next build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, test, security-tests, vet, frontend]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build API server image
        run: docker build -f apps/api-server/Dockerfile -t openoms-api:ci .

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Check Dashboard build secrets
        run: ./scripts/check-dashboard-build-secrets.sh

      - name: Test Dashboard Sentry guards
        run: ./scripts/test-dashboard-sentry-guards.sh

      - name: Build Dashboard image
        run: docker buildx build --load -f apps/dashboard/Dockerfile -t openoms-dashboard:ci ./apps/dashboard

      - name: Check Dashboard image hardening
        run: ./scripts/check-dashboard-image.sh openoms-dashboard:ci

  github-actions-pinning:
    name: GitHub Actions Pinning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate GitHub Actions pinning
        run: scripts/validate-github-actions-pinning.sh

  auto-merge-gate:
    name: Auto-Merge Gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs:
      - lint-strict
      - vet
      - test
      - security-tests
      - security
      - frontend
      - helm-chart
      - docker
      - github-actions-pinning
    # Auto-merge for Dependabot and bot branches.
    # Requires lint-strict (no pre-existing issues allowed for auto-merge).
    # e2e and migration-safety excluded from needs — e2e is informational,
    # migration-safety may be skipped (no migrations in dependency PRs).
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.head.ref, 'dependabot/') ||
       startsWith(github.event.pull_request.head.ref, 'bot/'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check CodeRabbit reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UNRESOLVED=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviewThreads(first:100) {
                    nodes { isResolved comments(first:20) { nodes { author { login } } } }
                  }
                }
              }
            }' -f owner="${{ github.repository_owner }}" \
               -f repo="${{ github.event.repository.name }}" \
               -F pr=${{ github.event.pull_request.number }} \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                   | select(.isResolved == false)
                   | select(any(.comments.nodes[]?; .author.login == "coderabbitai"))]
                   | length')
          if [ "$UNRESOLVED" -gt 0 ]; then
            echo "::warning::$UNRESOLVED unresolved CodeRabbit threads"
            exit 1
          fi
      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch
