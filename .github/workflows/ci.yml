name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.8"

jobs:
  auto-format:
    name: Auto-format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0

      - name: Auto-fix Go code
        run: |
          for dir in apps/api-server packages/allegro-go-sdk packages/inpost-go-sdk packages/order-engine packages/erli-go-sdk packages/ebay-go-sdk; do
            echo "Fixing $dir..."
            golangci-lint run --fix --timeout=5m "./$dir/..." || true
          done

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Auto-fix frontend code
        working-directory: apps/dashboard
        run: |
          npm ci
          npx eslint --fix src/ || true

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint api-server
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: apps/api-server
          args: --timeout=5m
          only-new-issues: true

      - name: Lint allegro-go-sdk
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: packages/allegro-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint inpost-go-sdk
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: packages/inpost-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint order-engine
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: packages/order-engine
          args: --timeout=5m
          only-new-issues: true

      - name: Lint erli-go-sdk
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: packages/erli-go-sdk
          args: --timeout=5m
          only-new-issues: true

      - name: Lint ebay-go-sdk
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: packages/ebay-go-sdk
          args: --timeout=5m
          only-new-issues: true

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan api-server
        working-directory: apps/api-server
        run: govulncheck ./...

      - name: Scan allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: govulncheck ./...

      - name: Scan inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: govulncheck ./...

      - name: Scan order-engine
        working-directory: packages/order-engine
        run: govulncheck ./...

      - name: Scan erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: govulncheck ./...

      - name: Scan ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: govulncheck ./...

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Audit frontend dependencies
        working-directory: apps/dashboard
        run: npm ci && npm audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openoms
          POSTGRES_PASSWORD: openoms_dev
          POSTGRES_DB: openoms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openoms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://openoms:openoms_dev@localhost:5432/openoms_dev?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run migrations
        run: |
          PGPASSWORD=openoms_dev psql -h localhost -U openoms -d openoms_dev -f apps/api-server/migrations/000001_init_schema.up.sql

      - name: Test api-server
        working-directory: apps/api-server
        run: go test -race -cover ./...

      - name: Test erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: go test ./...

      - name: Test allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: go test ./...

      - name: Test inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: go test ./...

      - name: Test order-engine
        working-directory: packages/order-engine
        run: go test ./...

      - name: Test dhl-go-sdk
        working-directory: packages/dhl-go-sdk
        run: go test ./...

      - name: Test ksef-go-sdk
        working-directory: packages/ksef-go-sdk
        run: go test ./...

      - name: Test amazon-sp-sdk
        working-directory: packages/amazon-sp-sdk
        run: go test ./...

      - name: Test dpd-go-sdk
        working-directory: packages/dpd-go-sdk
        run: go test ./...

      - name: Test gls-go-sdk
        working-directory: packages/gls-go-sdk
        run: go test ./...

      - name: Test btp-go-sdk
        working-directory: packages/btp-go-sdk
        run: go test ./...

      - name: Test ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: go test ./...

  security-tests:
    name: Security Tests
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run security tests
        working-directory: apps/api-server
        env:
          REDIS_URL: redis://localhost:6379
        run: go test -race -run 'TestSecurity_' ./internal/middleware/ ./internal/handler/

  vet:
    name: Vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet api-server
        working-directory: apps/api-server
        run: go vet ./...

      - name: Vet allegro-go-sdk
        working-directory: packages/allegro-go-sdk
        run: go vet ./...

      - name: Vet inpost-go-sdk
        working-directory: packages/inpost-go-sdk
        run: go vet ./...

      - name: Vet order-engine
        working-directory: packages/order-engine
        run: go vet ./...

      - name: Vet erli-go-sdk
        working-directory: packages/erli-go-sdk
        run: go vet ./...

      - name: Vet ebay-go-sdk
        working-directory: packages/ebay-go-sdk
        run: go vet ./...

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'migration:destructive')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration backward-compatibility
        run: |
          DANGEROUS_OPS="DROP COLUMN|DROP TABLE|RENAME COLUMN|ALTER.*TYPE|DROP INDEX"
          NEW_MIGRATIONS=$(git diff --name-only origin/main... -- apps/api-server/migrations/ 2>/dev/null || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations found — skipping"
            exit 0
          fi
          BLOCKED=0
          for f in $NEW_MIGRATIONS; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -iEq "$DANGEROUS_OPS" "$f"; then
              echo "BLOCKED: $f contains destructive operation"
              grep -inE "$DANGEROUS_OPS" "$f"
              BLOCKED=1
            fi
          done
          if [ "$BLOCKED" = "1" ]; then
            echo ""
            echo "Blue-green deployment requires backward-compatible migrations."
            echo "Split destructive changes into 2 deploys."
            echo "Override: add 'migration:destructive' label to the PR."
            exit 1
          fi
          echo "All migrations are backward-compatible"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Lint
        working-directory: apps/dashboard
        run: npx eslint src/

      - name: Unit tests
        working-directory: apps/dashboard
        run: npx vitest run

      - name: Build
        working-directory: apps/dashboard
        run: npx next build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, test, security-tests, vet, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API server image
        run: docker build -f apps/api-server/Dockerfile -t openoms-api:ci .

      - name: Build Dashboard image
        run: docker build -f apps/dashboard/Dockerfile -t openoms-dashboard:ci ./apps/dashboard
