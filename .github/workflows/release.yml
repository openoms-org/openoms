name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/openoms-org/openoms-api
  DASHBOARD_IMAGE: ghcr.io/openoms-org/openoms-dashboard
  MIGRATE_IMAGE: ghcr.io/openoms-org/openoms-migrate

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-server/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            ${{ env.DASHBOARD_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN || '' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  build-migrate:
    name: Build Migrate Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
            ${{ env.MIGRATE_IMAGE }}:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  scan-images:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build-api, build-dashboard, build-migrate]
    continue-on-error: true
    permissions:
      packages: read
      security-events: write
    strategy:
      matrix:
        image: [openoms-api, openoms-dashboard, openoms-migrate]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/openoms-org/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  notify-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-api, build-dashboard, build-migrate, scan-images]
    steps:
      - name: Dispatch to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.ENTERPRISE_DEPLOY_TOKEN }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
        if: ${{ env.DEPLOY_TOKEN != '' && env.DEPLOY_REPO != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ENTERPRISE_DEPLOY_TOKEN }}
          repository: ${{ secrets.DEPLOY_REPO }}
          event-type: openoms-release
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "images": {"api": "${{ env.API_IMAGE }}:${{ github.sha }}", "dashboard": "${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}", "migrate": "${{ env.MIGRATE_IMAGE }}:${{ github.sha }}"}}'

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-api, build-dashboard, build-migrate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Get commit info
        id: info
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"New Release Deployed\",
              \"description\": \"**${{ steps.info.outputs.message }}**\",
              \"color\": 3066993,
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"[\`${{ steps.info.outputs.short_sha }}\`](https://github.com/openoms-org/openoms/commit/${{ github.sha }})\", \"inline\": true},
                {\"name\": \"Author\", \"value\": \"${{ steps.info.outputs.author }}\", \"inline\": true}
              ],
              \"footer\": {\"text\": \"OpenOMS Release Pipeline\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$WEBHOOK_URL"
