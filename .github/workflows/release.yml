name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/**"
      - ".github/workflows/release.yml"
      - "scripts/check-dashboard-bundle-placeholders.sh"
      - "scripts/check-dashboard-image.sh"
      - "scripts/check-dashboard-release-config.sh"
      - "scripts/check-sbom-artifacts.sh"
      - "scripts/install-syft.sh"
      - "go.work"
      - "go.work.sum"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/openoms-org/openoms-api
  DASHBOARD_IMAGE: ghcr.io/openoms-org/openoms-dashboard
  MIGRATE_IMAGE: ghcr.io/openoms-org/openoms-migrate
  SYFT_VERSION: v1.44.0

jobs:
  release-api:
    name: Release API Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build API image for scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: apps/api-server/Dockerfile
          load: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Scan API image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-openoms-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload API Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        if: always()
        with:
          sarif_file: trivy-openoms-api.sarif
          category: trivy-openoms-api

      - name: Scan API image with Trivy (blocking on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Install Syft
        run: ./scripts/install-syft.sh "${SYFT_VERSION}"

      - name: Generate API SBOM
        run: |
          mkdir -p sbom
          syft "docker:${API_IMAGE}:${GITHUB_SHA}" \
            --source-name openoms-api \
            --source-version "${GITHUB_SHA}" \
            -o "cyclonedx-json=sbom/openoms-api-${GITHUB_SHA}.cdx.json"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API SHA image
        run: |
          docker push "${API_IMAGE}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "${API_IMAGE}:${GITHUB_SHA}")"
          if [ -z "${digest}" ]; then
            echo "Unable to resolve pushed API image digest" >&2
            exit 1
          fi
          printf '%s\n' "${digest}" > "sbom/openoms-api-${GITHUB_SHA}.digest.txt"

      - name: Upload API SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openoms-api-sbom-${{ github.sha }}
          path: |
            sbom/openoms-api-${{ github.sha }}.cdx.json
            sbom/openoms-api-${{ github.sha }}.digest.txt
          if-no-files-found: error
          retention-days: 30

  release-dashboard:
    name: Release Dashboard Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check Dashboard release Sentry config
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}
        run: ./scripts/check-dashboard-release-config.sh

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Dashboard image for scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          load: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          # NEXT_PUBLIC_* values are baked into the client bundle at build time.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
          secrets: |
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Check Dashboard image hardening
        run: ./scripts/check-dashboard-image.sh "${DASHBOARD_IMAGE}:${GITHUB_SHA}"

      - name: Scan Dashboard image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-openoms-dashboard.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Dashboard Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        if: always()
        with:
          sarif_file: trivy-openoms-dashboard.sarif
          category: trivy-openoms-dashboard

      - name: Scan Dashboard image with Trivy (blocking on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Install Syft
        run: ./scripts/install-syft.sh "${SYFT_VERSION}"

      - name: Generate Dashboard SBOM
        run: |
          mkdir -p sbom
          syft "docker:${DASHBOARD_IMAGE}:${GITHUB_SHA}" \
            --source-name openoms-dashboard \
            --source-version "${GITHUB_SHA}" \
            -o "cyclonedx-json=sbom/openoms-dashboard-${GITHUB_SHA}.cdx.json"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Dashboard SHA image
        run: |
          docker push "${DASHBOARD_IMAGE}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "${DASHBOARD_IMAGE}:${GITHUB_SHA}")"
          if [ -z "${digest}" ]; then
            echo "Unable to resolve pushed Dashboard image digest" >&2
            exit 1
          fi
          printf '%s\n' "${digest}" > "sbom/openoms-dashboard-${GITHUB_SHA}.digest.txt"

      - name: Upload Dashboard SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openoms-dashboard-sbom-${{ github.sha }}
          path: |
            sbom/openoms-dashboard-${{ github.sha }}.cdx.json
            sbom/openoms-dashboard-${{ github.sha }}.digest.txt
          if-no-files-found: error
          retention-days: 30

  release-migrate:
    name: Release Migrate Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Migrate image for scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: deploy/Dockerfile.migrate
          load: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Scan Migrate image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-openoms-migrate.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Migrate Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        if: always()
        with:
          sarif_file: trivy-openoms-migrate.sarif
          category: trivy-openoms-migrate

      - name: Scan Migrate image with Trivy (blocking on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Install Syft
        run: ./scripts/install-syft.sh "${SYFT_VERSION}"

      - name: Generate Migrate SBOM
        run: |
          mkdir -p sbom
          syft "docker:${MIGRATE_IMAGE}:${GITHUB_SHA}" \
            --source-name openoms-migrate \
            --source-version "${GITHUB_SHA}" \
            -o "cyclonedx-json=sbom/openoms-migrate-${GITHUB_SHA}.cdx.json"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Migrate SHA image
        run: |
          docker push "${MIGRATE_IMAGE}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "${MIGRATE_IMAGE}:${GITHUB_SHA}")"
          if [ -z "${digest}" ]; then
            echo "Unable to resolve pushed Migrate image digest" >&2
            exit 1
          fi
          printf '%s\n' "${digest}" > "sbom/openoms-migrate-${GITHUB_SHA}.digest.txt"

      - name: Upload Migrate SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openoms-migrate-sbom-${{ github.sha }}
          path: |
            sbom/openoms-migrate-${{ github.sha }}.cdx.json
            sbom/openoms-migrate-${{ github.sha }}.digest.txt
          if-no-files-found: error
          retention-days: 30

  publish-sbom:
    name: Publish Release SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [release-api, release-dashboard, release-migrate]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download image SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openoms-*-sbom-${{ github.sha }}
          path: sbom
          merge-multiple: true

      - name: Validate release SBOM artifacts
        run: ./scripts/check-sbom-artifacts.sh "${GITHUB_SHA}"

      - name: Upload release SBOM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openoms-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  promote-latest:
    name: Promote Latest Tags
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    needs: [release-api, release-dashboard, release-migrate, publish-sbom]
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote SHA images to latest
        run: |
          docker buildx imagetools create --tag "${API_IMAGE}:latest" "${API_IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools create --tag "${DASHBOARD_IMAGE}:latest" "${DASHBOARD_IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools create --tag "${MIGRATE_IMAGE}:latest" "${MIGRATE_IMAGE}:${GITHUB_SHA}"

  notify-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [promote-latest]
    steps:
      - name: Dispatch to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.ENTERPRISE_DEPLOY_TOKEN }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
        if: ${{ env.DEPLOY_TOKEN != '' && env.DEPLOY_REPO != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.ENTERPRISE_DEPLOY_TOKEN }}
          repository: ${{ secrets.DEPLOY_REPO }}
          event-type: openoms-release
          client-payload: >-
            {"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "images": {"api": "${{ env.API_IMAGE }}:${{ github.sha }}", "dashboard": "${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}", "migrate": "${{ env.MIGRATE_IMAGE }}:${{ github.sha }}"}, "sbom_artifact": "openoms-sbom-${{ github.sha }}"}

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [promote-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 5

      - name: Get commit info
        id: info
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"New Release Deployed\",
              \"description\": \"**${{ steps.info.outputs.message }}**\",
              \"color\": 3066993,
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"[\`${{ steps.info.outputs.short_sha }}\`](https://github.com/openoms-org/openoms/commit/${{ github.sha }})\", \"inline\": true},
                {\"name\": \"Author\", \"value\": \"${{ steps.info.outputs.author }}\", \"inline\": true}
              ],
              \"footer\": {\"text\": \"OpenOMS Release Pipeline\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$WEBHOOK_URL"
