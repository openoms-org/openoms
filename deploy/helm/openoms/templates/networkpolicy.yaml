{{- if .Values.networkPolicy.enabled }}
# Allow ingress to API and Dashboard only from ingress-nginx and cloudflared namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openoms.fullname" . }}-allow-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoms.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}
        - protocol: TCP
          port: {{ .Values.dashboard.port }}
    # Allow traffic from cloudflared namespace (Cloudflare Tunnel)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cloudflaredNamespace | default "cloudflared" }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}
        - protocol: TCP
          port: {{ .Values.dashboard.port }}
    # Allow intra-namespace traffic (pod-to-pod within openoms)
    - from:
        - podSelector: {}
---
{{- $egress := .Values.networkPolicy.egress | default dict }}
{{- $dns := $egress.dns | default dict }}
{{- $https := $egress.https | default dict }}
{{- $database := $egress.database | default dict }}
{{- $redis := $egress.redis | default dict }}
{{- $dnsPorts := list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53) }}
{{- $httpsPorts := list (dict "protocol" "TCP" "port" 443) }}
{{- $databasePorts := list (dict "protocol" "TCP" "port" 5432) (dict "protocol" "TCP" "port" 6543) }}
{{- $redisPorts := list (dict "protocol" "TCP" "port" 6379) }}
# Restrict egress: allow DNS, HTTPS, database, Redis, and intra-namespace access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openoms.fullname" . }}-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoms.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        {{- toYaml ($dns.ports | default $dnsPorts) | nindent 8 }}
      {{- with $dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # HTTPS (external APIs: Allegro, InPost, S3, etc.)
    - ports:
        {{- toYaml ($https.ports | default $httpsPorts) | nindent 8 }}
      {{- with $https.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # PostgreSQL — in-cluster or external (e.g. Supabase managed)
    - ports:
        {{- toYaml ($database.ports | default $databasePorts) | nindent 8 }}
      {{- with $database.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Redis
    - ports:
        {{- toYaml ($redis.ports | default $redisPorts) | nindent 8 }}
      {{- with $redis.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Intra-namespace (pod-to-pod)
    - to:
        - podSelector: {}
{{- end }}
