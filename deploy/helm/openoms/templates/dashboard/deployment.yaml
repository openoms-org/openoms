apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoms.fullname" . }}-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoms.labels" . | nindent 4 }}
    {{- include "openoms.dashboard.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "openoms.dashboard.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.dashboard.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "openoms.labels" . | nindent 8 }}
        {{- include "openoms.dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: env-replace
          image: {{ include "openoms.dashboard.image" . }}
          command:
            - /bin/sh
            - -c
            - |
              cp -a /app/.next/static/. /static-out/
              cp /app/server.js /server-out/server.js
              if [ -n "$NEXT_PUBLIC_API_URL" ] && [ "$NEXT_PUBLIC_API_URL" != "NEXT_PUBLIC_API_URL_PLACEHOLDER" ]; then
                find /static-out -type f -name '*.js' | while read -r file; do
                  if grep -q 'NEXT_PUBLIC_API_URL_PLACEHOLDER' "$file" 2>/dev/null; then
                    sed -i "s|NEXT_PUBLIC_API_URL_PLACEHOLDER|${NEXT_PUBLIC_API_URL}|g" "$file"
                  fi
                done
                sed -i "s|NEXT_PUBLIC_API_URL_PLACEHOLDER|${NEXT_PUBLIC_API_URL}|g" /server-out/server.js
              fi
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.apiServer.baseUrl | quote }}
          volumeMounts:
            - name: static-assets
              mountPath: /static-out
            - name: server-js
              mountPath: /server-out
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: dashboard
          image: {{ include "openoms.dashboard.image" . }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          command: ["node", "server.js"]
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: "0.0.0.0"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            {{- toYaml .Values.dashboard.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.dashboard.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.dashboard.securityContext | nindent 12 }}
          volumeMounts:
            - name: static-assets
              mountPath: /app/.next/static
            - name: server-js
              mountPath: /app/server.js
              subPath: server.js
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: static-assets
          emptyDir:
            sizeLimit: 200Mi
        - name: server-js
          emptyDir:
            sizeLimit: 10Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
