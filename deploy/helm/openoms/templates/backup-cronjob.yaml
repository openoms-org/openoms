{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openoms.fullname" . }}-db-backup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "openoms.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  FILENAME="openoms-${TIMESTAMP}.sql.gz"

                  echo "Starting backup: ${FILENAME}"
                  pg_dump "${DATABASE_URL}" \
                    --no-owner \
                    --no-privileges \
                    --format=plain \
                    | gzip > "/tmp/${FILENAME}"

                  SIZE=$(stat -c%s "/tmp/${FILENAME}" 2>/dev/null || stat -f%z "/tmp/${FILENAME}")
                  echo "Backup size: ${SIZE} bytes"

                  if [ "${SIZE}" -lt 1000 ]; then
                    echo "ERROR: Backup too small (${SIZE} bytes), likely empty"
                    exit 1
                  fi

                  echo "Uploading to S3: s3://${S3_BUCKET}/${S3_PREFIX}${FILENAME}"
                  apk add --no-cache aws-cli >/dev/null 2>&1
                  S3_ARGS="--endpoint-url ${S3_ENDPOINT}"
                  if [ -n "${AWS_DEFAULT_REGION}" ]; then
                    S3_ARGS="${S3_ARGS} --region ${AWS_DEFAULT_REGION}"
                  fi
                  aws s3 cp "/tmp/${FILENAME}" "s3://${S3_BUCKET}/${S3_PREFIX}${FILENAME}" ${S3_ARGS}

                  echo "Backup completed: ${FILENAME} (${SIZE} bytes)"

                  {{- if .Values.backup.retentionDays }}
                  echo "Cleaning backups older than {{ .Values.backup.retentionDays }} days..."
                  CUTOFF=$(date -d "-{{ .Values.backup.retentionDays }} days" +%Y%m%d 2>/dev/null || date -v-{{ .Values.backup.retentionDays }}d +%Y%m%d)
                  aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}" ${S3_ARGS} \
                    | awk '{print $4}' \
                    | grep '^openoms-' \
                    | while read -r file; do
                        FILE_DATE=$(echo "$file" | sed 's/openoms-\([0-9]*\)-.*/\1/')
                        if [ "${FILE_DATE}" \< "${CUTOFF}" ]; then
                          echo "Deleting old backup: ${file}"
                          aws s3 rm "s3://${S3_BUCKET}/${S3_PREFIX}${file}" ${S3_ARGS}
                        fi
                      done
                  echo "Cleanup done"
                  {{- end }}
              env:
                # Use migration (superuser) URL for backups — app URL is RLS-restricted
                # and would produce incomplete dumps missing other tenants' data.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "openoms.secretName" . }}
                      key: MIGRATION_DATABASE_URL
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | default "backups/" | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                {{- if .Values.backup.s3.region }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- end }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "openoms.secretName" . }}
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "openoms.secretName" . }}
                      key: S3_SECRET_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
{{- end }}
