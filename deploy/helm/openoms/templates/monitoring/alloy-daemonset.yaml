{{- if and .Values.monitoring .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "openoms.fullname" . }}-alloy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: alloy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/monitoring/alloy-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: alloy
    spec:
      serviceAccountName: {{ include "openoms.fullname" . }}-alloy
      automountServiceAccountToken: true
      # Alloy requires root to read /var/log and /var/lib/docker/containers
      # for log collection. Container-level securityContext compensates:
      # readOnlyRootFilesystem: true, allowPrivilegeEscalation: false,
      # capabilities.drop: ALL (only DAC_READ_SEARCH added).
      # Namespace PSS must allow this pod (baseline, not restricted).
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.secretName" . }}
                  key: METRICS_TOKEN
                  optional: true
            - name: GRAFANA_REMOTE_WRITE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.fullname" . }}-monitoring
                  key: GRAFANA_REMOTE_WRITE_URL
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.fullname" . }}-monitoring
                  key: GRAFANA_USER
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.fullname" . }}-monitoring
                  key: GRAFANA_TOKEN
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.fullname" . }}-monitoring
                  key: LOKI_URL
                  optional: true
            - name: LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openoms.fullname" . }}-monitoring
                  key: LOKI_USER
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 384Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "openoms.fullname" . }}-alloy-config
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}
