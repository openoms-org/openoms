namespace: openoms

apiServer:
  replicaCount: 1
  image:
    repository: ghcr.io/openoms-org/openoms-api
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  port: 8080
  service:
    port: 8080  # K8s Service port (match containerPort for Cloudflare Tunnel)
  env: production
  baseUrl: https://api.openoms.example.com
  frontendUrl: https://app.openoms.example.com
  uploadDir: /tmp/uploads
  maxUploadSize: "10485760"
  features:
    allegro: true
    inpost: true
  s3:
    enabled: true
    bucket: openoms-uploads
    region: eu-central-1
    endpoint: ""
    publicUrl: ""
    forcePathStyle: false  # set true for Hetzner, MinIO, DigitalOcean Spaces
  openai:
    model: gpt-4o-mini
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ['ALL']
    seccompProfile:
      type: RuntimeDefault
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

workerStrategy: separate  # "separate" or "embedded"

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 384Mi

dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/openoms-org/openoms-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  port: 3000
  service:
    port: 3000  # K8s Service port (match containerPort for Cloudflare Tunnel)
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ['ALL']
    seccompProfile:
      type: RuntimeDefault
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

migration:
  image:
    repository: ghcr.io/openoms-org/openoms-migrate
    tag: ""

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls:
    enabled: false  # set true + add cert-manager annotation for non-tunnel setups
  api:
    host: api.openoms.example.com
    tlsSecret: openoms-api-tls
  dashboard:
    host: app.openoms.example.com
    tlsSecret: openoms-dashboard-tls

secrets:
  createPlainSecret: false
  name: openoms-secrets

imagePullSecrets:
  - name: ghcr-pull-secret

networkPolicy:
  enabled: false  # set true in production for namespace-level isolation
  ingressNamespace: ingress-nginx
  cloudflaredNamespace: cloudflared

backup:
  enabled: false
  schedule: "0 3 * * *"  # daily at 3 AM
  retentionDays: 30
  s3:
    bucket: openoms-backups
    prefix: "backups/"
    endpoint: ""
    region: ""
    forcePathStyle: false

database:
  host: postgres
